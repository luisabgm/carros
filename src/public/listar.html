<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Carros Cadastrados</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://carimagesapi.com/assets/js/carimages.js"
      data-api-key="ci_b5e5e909a3a6708fbf1266594266c0c478a507d51b2b522ad3ce9eac"
      async
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="ml-10 mr-10 border-l-3">
    <script>
      fetch("header.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("header-placeholder").innerHTML = data;
        }); // Função para adicionar o elemento header à página
    </script>
    <div id="header-placeholder"></div>

    <section class="mt-20 rounded-xl border border-black/[0.07] bg-white p-4 shadow-[0_1px_2px_rgba(0,0,0,.02)] sm:p-5; ">

      <form method="GET" class="form grid gap-4 sm:grid-cols-4 lg:grid-cols-12; ">
        <label for="nameFilter" class="block mb-2.5 text-sm font-medium text-heading lg:col-span-3; ">Nome</label>
        <input
          type="text"
          id="nameFilter"
          class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
          placeholder="Informe o nome do carro"
        />
      </div>

      <div>
        <label for="yearFilter" class="block mb-2.5 text-sm font-medium text-heading ">Ano</label>
        <select id="yearFilter">
          <option value="" selected> Selecione o ano</option>
          

        </select>
      </div>

      
      <div>
        <label for="brandFilter" class="block mb-2.5 text-sm font-medium text-heading">Marca</label>
        <select id="brandFilter">
          <option value="" selected> Selecione a marca</option>
          

        </select>
        <button type="submit" class=" h-11 self-end rounded-md bg-zinc-900 px-5 text-sm font-medium text-white transition hover:bg-black sm:col-span-1 lg:col-span-1"
        onclick="filtrarCarro()"
        value="Enviar">Aplicar filtros</button>
      </form>
    </section>

    <br />
    <section class="flex justify-center gap-10 h-10 mt-12 ml-5">
      <div id="valorDistancia"></div>
    </section>
    <table id="listaCarros" class="w-full text-left table-auto min-w-max">
      <thead>
        <tr>
          <th class="p-4 border-b border-blue-gray-100 bg-blue-gray-50">
            <p
              class="block font-sans text-sm antialiased font-normal leading-none text-blue-gray-900 opacity-70"
            >
              Nome
            </p>
          </th>
          <th class="p-4 border-b border-blue-gray-100 bg-blue-gray-50">
            <p
              class="block font-sans text-sm antialiased font-normal leading-none text-blue-gray-900 opacity-70"
            >
              Ano
            </p>
          </th>
          <th class="p-4 border-b border-blue-gray-100 bg-blue-gray-50">
            <p
              class="block font-sans text-sm antialiased font-normal leading-none text-blue-gray-900 opacity-70"
            >
              Marca
            </p>
          </th>
          <th class="p-4 border-b border-blue-gray-100 bg-blue-gray-50">
            <p
              class="block font-sans text-sm antialiased font-normal leading-none text-blue-gray-900 opacity-70"
            >
              Kms por Litro
            </p>
          </th>
          <th class="p-4 border-b border-blue-gray-100 bg-blue-gray-50">
            <p
              class="block font-sans text-sm antialiased font-normal leading-none text-blue-gray-900 opacity-70"
            >
              Imagem
            </p>
          </th>
          <th class="p-4 border-b border-blue-gray-100 bg-blue-gray-50">
            <p
              class="block font-sans text-sm antialiased font-normal leading-none text-blue-gray-900 opacity-70"
            >
              Ação
            </p>
          </th>
        </tr>
      </thead>

      <tbody id="corpoTabela"></tbody>
    </table>

    <script src="listar.js"></script>
  </body>
</html>
